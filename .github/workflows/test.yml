# .github/workflows/test.yml
name: CI - Тестирование проекта

on:
  push:
    branches: [ "main" ] # Запуск при пуше в main
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 1. Запускаем чистую PostgreSQL для тестов
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск тестов pytest
      env:
        # 2. Указываем тестовой БД подключиться к сервису PostgreSQL
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: |
        # Применяем миграции к тестовой БД
        alembic upgrade head
        # Запускаем тесты
        pytest app/tests/ -v
